<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  
  <title>Frontend Mentor | Results summary component</title>

  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main>
    <div class="result" >
      <h3>Your Result</h3>
      <div class="num">
        <h1 style="font-size: 52px; font-family: 'HankenGrotesk'; font-weight: 800; margin-bottom: -10px; margin-top: 40px;">76</h1>
        <p style="color: hsla(0, 0%, 100%, 0.428); font-size: 14px;">of 100</p>
      </div>

      <h1>Great</h1>
      <p style="text-align: center; font-size: 14px;">You scored higher than 65% of the people who have taken these tests.</p>
    </div>

    <div class="summary">
      <h2 style="margin-bottom: 0;">Summary</h2>

      <div class="block reaction">
        <img src="assets/images/icon-reaction.svg">
        <p class="text-des" style="color: var(--light-red);">Reaction</p>
        <p class="num-des">80 / 100</p>
      </div>

      <div class="block memory">
        <img src="assets/images/icon-memory.svg">
        <p class="text-des" style="color: var(--orangey-yellow)";>Memory</p>
        <p class="num-des">92 / 100</p>
      </div>

      <div class="block verbal">
        <img src="assets/images/icon-verbal.svg">
        <p class="text-des" style="color: var(--green-teal)";>Verbal</p>
        <p class="num-des">61 / 100</p>
      </div>

      <div class="block visual">
        <img src="assets/images/icon-visual.svg">
        <p class="text-des" style="color: var(--cobalt-blue)";>Visual</p>
        <p class="num-des">72 / 100</p>
      </div>

      <button class="continue">Continue</button>
    </div>
  </main>
  <footer>
    <div class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="https://github.com/nighteeweb">nightee</a>.
    </div>
</footer>
</body>
</html>
